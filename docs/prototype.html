<style>
/* Layout: one phone-width column, reading text in a book face, UI in a sans; bottom tab bar. Articles carry their own colors (der/die/das). */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212c; --muted:#5a6676; --line:#dbe1e8;
  --accent:#2a4a94; --accent-soft:#e3e9f7; --learn:#fbe6a2; --good:#2f8a55; --bad:#c43b44;
  --der:#2c66cc; --die:#cc3d47; --das:#2b8f53;
  --read:"Literata",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#18202a; --ink:#e6ebf1; --muted:#98a5b4; --line:#2a3542;
  --accent:#93b1ff; --accent-soft:#223152; --learn:#5b4a14; --good:#5cc98a; --bad:#ff7d85;
  --der:#74a3ff; --die:#ff7f87; --das:#62d494; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#18202a; --ink:#e6ebf1; --muted:#98a5b4; --line:#2a3542;
  --accent:#93b1ff; --accent-soft:#223152; --learn:#5b4a14; --good:#5cc98a; --bad:#ff7d85;
  --der:#74a3ff; --die:#ff7f87; --das:#62d494; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.w:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--read);font-weight:600;font-size:26px}
.top .date{color:var(--muted);font-size:13px}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tcard{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.lvl{grid-row:span 2;align-self:start;font-weight:700;font-size:13px;border-radius:6px;padding:4px 7px;background:var(--accent-soft);color:var(--accent)}
.tcard h3{font-family:var(--read);font-size:17px;font-weight:600;line-height:1.3}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.cov{font-weight:600;color:var(--good)}
.tcard.locked{opacity:.62}
.newbtn{margin-top:12px;width:100%;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:12px;font-weight:600}

/* reader */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:none;background:none;padding:4px 6px 4px 0;font-size:20px;color:var(--muted)}
.rtitle{font-family:var(--read);font-size:22px;font-weight:600;line-height:1.25;margin:6px 0 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 4px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.text{font-family:var(--read);font-size:19px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:10px}
.sent{border-radius:6px;transition:background .2s}
.sent.proof{background:var(--accent-soft)}
.w{cursor:pointer;border-radius:4px;padding:0 1px}
.w.new{text-decoration:underline dotted var(--muted);text-underline-offset:5px}
.w.learning{background:var(--learn)}
.w.hl{outline:2px solid var(--accent);outline-offset:1px}
.artcol .w[data-art="der"]{color:var(--der)} .artcol .w[data-art="die"]{color:var(--die)} .artcol .w[data-art="das"]{color:var(--das)}
.sbtn{font-family:var(--ui);font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:3px;line-height:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.section{margin-top:22px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.q p{margin:0 0 10px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb{font-size:13px;color:var(--muted);margin-top:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;border:1px solid var(--line);padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:78vh;overflow:auto;box-shadow:0 -10px 30px rgb(0 0 0 / .18)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.lemma{font-family:var(--read);font-size:26px;font-weight:600}
.art{font-weight:700}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.ctx{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.ctx b{display:block;font-size:17px}
.mwe{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.mwe .de{font-family:var(--read);font-weight:600;font-size:16px}
.sheet .tools{margin-top:14px}
.tr{font-family:var(--read);font-size:17px;margin:4px 0 12px}
.note{font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px}

/* vocab */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;border:none;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mi{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-size:14px;min-height:46px;overflow-wrap:anywhere}
.mi.de{font-family:var(--read);font-weight:600}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.done{opacity:.35;pointer-events:none;border-color:var(--good)}
.mi.shake{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font-family:var(--read);font-size:30px;font-weight:600;text-align:center;margin:18px 0 2px}
.sub{text-align:center;color:var(--muted);margin-bottom:16px}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 0;font-size:18px;font-weight:700}
.ab.der{color:var(--der)} .ab.die{color:var(--die)} .ab.das{color:var(--das)}
.ab.ok{border-color:var(--good)} .ab.no{border-color:var(--bad)}
.cloze{font-family:var(--read);font-size:18px;line-height:1.6;margin:10px 0 14px}
.gap{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent)}
.result{margin-top:12px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.sched{font-size:12.5px;color:var(--muted);margin-top:4px}
.cards{display:flex;flex-direction:column;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.crow{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:none;padding:12px 14px}
.crow:first-child{border-top:none}
.cmain{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.crow .de{font-family:var(--read);font-weight:600}
.crow .trw{color:var(--muted);font-size:13.5px;text-align:right;min-width:0}
.csent{font-family:var(--read);font-size:14px;line-height:1.5;color:var(--muted)}
.csent b,.gsent b{color:var(--ink);background:var(--learn);font-weight:600;border-radius:3px;padding:0 2px}
.due{font-size:11.5px;font-weight:700;color:var(--accent)}
.gsent{font-family:var(--read);font-size:17px;line-height:1.6;margin:8px 0 6px}
.gq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-weight:600;font-size:14px}
.gq span{flex:1;min-width:140px}
.fam{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.fam div{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.fam .de{font-family:var(--read);font-weight:600}
.fam .tr2{color:var(--muted);font-size:13.5px;text-align:right}
.rule{margin-top:8px;font-size:13.5px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:18px}
.wnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.wnums b{display:block;font-size:20px}
.wnums span{font-size:12px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;max-width:26px;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:3px}
.bar.empty i{background:var(--line)}
.bar.today{color:var(--ink);font-weight:700}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav div{display:flex;width:100%;max-width:480px}
.nb{flex:1;border:none;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nb svg{width:22px;height:22px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const it=items[i];
  ex.innerHTML=`<div class="mhead"><span>Kelime ailesi</span><span>${i+1} / ${items.length}</span></div>
  <button class="big" id="f-base" style="display:block;width:100%;border:none;background:none">${esc(it.base)}</button><div class="sub">${esc(it.btr)} → <b>${esc(it.ask)}</b>?</div>
  <div class="opts">${it.o.map(o=>`<button class="opt" data-f="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="f-res"></div>`;
  $("#f-base").onclick=()=>say(it.base);
  ex.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.f===it.ans;if(ok)score++;
   ex.querySelectorAll("[data-f]").forEach(x=>{x.disabled=true;if(x.dataset.f===it.ans)x.classList.add("ok");else if(x===b)x.classList.add("no")});
   sayDe(it.ans);
   $("#f-res").innerHTML=`<div class="result"><b>${ok?"Doğru":"Yanlış"}</b> · aile:<div class="fam">${it.fam.map(([d,t])=>`<div><span class="de">${esc(d)}</span><span class="tr2">${esc(t)}</span></div>`).join("")}</div><div class="rule">Kural: ${esc(it.rule)}</div><div class="tools"><button class="btn primary" id="f-next">Devam</button></div></div>`;
   $("#f-next").onclick=()=>{i++;step()};
  });
 };step();
}

function exMatch(){
 let pairs;
 if(mmode==="tr")pairs=shuffle(Object.keys(LEX).filter(k=>status[k]!=="known").map(k=>[(LEX[k].art?LEX[k].art+" ":"")+LEX[k].w,LEX[k].tr])).slice(0,5);
 else pairs=PAIRS[mmode];
 const right=shuffle(pairs.map((p,i)=>({t:p[1],i})));
 const ex=$("#ex");
 ex.innerHTML=`<div class="chips" role="group" aria-label="Eşleştirme türü">${[["tr","DE ↔ TR"],["nv","Nomen ↔ Verb"],["vp","Verb ↔ Präp."]].map(([k,l])=>`<button class="chip" aria-pressed="${mmode===k}" data-mm="${k}">${l}</button>`).join("")}</div>
 <div class="mhead" style="margin-top:12px"><span id="m-time">0 sn</span><span id="m-err">0 hata</span></div>
 <div class="match"><div class="mcol">${pairs.map((p,i)=>`<button class="mi de" data-l="${i}">${esc(p[0])}</button>`).join("")}</div>
 <div class="mcol">${right.map(r=>`<button class="mi" data-r="${r.i}">${esc(r.t)}</button>`).join("")}</div></div><div id="m-res"></div>`;
 ex.querySelectorAll("[data-mm]").forEach(b=>b.onclick=()=>{mmode=b.dataset.mm;exMatch()});
 let sel=null,done=0,err=0;const t0=Date.now();
 clearInterval(exMatch.timer);exMatch.timer=setInterval(()=>{const el=$("#m-time");if(!el)return clearInterval(exMatch.timer);el.textContent=Math.round((Date.now()-t0)/1000)+" sn"},500);
 ex.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ex.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=b;sayDe(b.textContent)});
 ex.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
  if(mmode!=="tr")sayDe(b.textContent);
  if(!sel)return toast("Önce soldan bir kelime seç");
  if(sel.dataset.l===b.dataset.r){sel.classList.remove("sel");sel.classList.add("done");b.classList.add("done");sel=null;done++;
   if(done===pairs.length){clearInterval(exMatch.timer);const sec=Math.round((Date.now()-t0)/1000);
    $("#m-res").innerHTML=`<div class="result"><b>Bitti · ${sec} sn · ${err} hata</b><div class="sched">${err===0?"Hepsi „Good“: sonraki tekrar 3–4 gün sonra":"Hatalı eşler bu oturumun sonunda tekrar gelecek"}</div><div class="tools"><button class="btn primary" id="m-again">Yeni tur</button></div></div>`;
    $("#m-again").onclick=exMatch}}
  else{err++;$("#m-err").textContent=err+" hata";[sel,b].forEach(x=>{x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")})}
 });
}

function exArt(){
 const nouns=shuffle(Object.keys(LEX).filter(k=>LEX[k].art));let i=0,score=0;
 const ex=$("#ex");
 const step=()=>{
  if(i>=6){ex.innerHTML=`<div class="big">${score} / 6</div><div class="sub">Artikel turu bitti</div><div class="tools" style="justify-content:center"><button class="btn primary" id="a-again">Yeni tur</button></div>`;$("#a-again").onclick=exArt;return}
  const l=LEX[nouns[i]];
  ex.innerHTML=`<div class="mhead"><span>Artikel & Plural</span><span>${i+1} / 6</span></div><div class="big">${esc(l.w)}</div><div class="sub">${esc(l.tr)}</div>
  <div class="arts">${["der","die","das"].map(a=>`<button class="ab ${a}" data-a="${a}">${a}</button>`).join("")}</div><div id="a-res"></div>`;
  ex.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.a===l.art;if(ok)score++;
   ex.querySelectorAll("[data-a]").forEach(x=>{x.disabled=true;if(x.dataset.a===l.art)x.classList.add("ok");else if(x===b)x.classList.add("no")});
   sayDe(l.art+" "+l.w);
   $("#a-res").innerHTML=`<div class="result"><b>${ok?"Doğru":"Yanlış"}:</b> <span class="art ${l.art}">${l.art}</span> ${esc(l.w)} · çoğul: ${esc(l.pl)}<div class="sched">${ok?"Sonraki tekrar: 3 gün":"Sonraki tekrar: 10 dk"}</div><div class="tools"><button class="btn primary" id="a-next">Devam</button></div></div>`;
   $("#a-next").onclick=()=>{i++;step()};
  });
 };step();
}

function exCloze(){
 const items=shuffle(CLOZE);let i=0;const ex=$("#ex");
 const step=()=>{
  if(i>=items.length){ex.innerHTML=`<div class="big">Bitti</div><div class="sub">Boşluk doldurma turu tamam</div><div class="tools" style="justify-content:center"><button class="btn primary" id="c-again">Yeni tur</button></div>`;$("#c-again").onclick=exCloze;return}
  const it=items[i],s=TEXT.sentences[it.s];let ph=false;
  const sent=s.t.map((t,ti)=>{const p=/^[.,]$/.test(t[0]);const w=(!ph&&t[0]===it.ans)?(ph=true,`<span class="gap">&nbsp;</span>`):esc(t[0]);return (ti===0||p?"":" ")+w}).join("");
  ex.innerHTML=`<div class="mhead"><span>Okuduğun metinden</span><span>${i+1} / ${items.length}</span></div><div class="cloze">${sent}</div>
  <div class="opts">${shuffle(it.o).map(o=>`<button class="opt" data-c="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="c-res"></div>`;
  ex.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.c===it.ans;
   ex.querySelectorAll("[data-c]").forEach(x=>{x.disabled=true;if(x.dataset.c===it.ans)x.classList.add("ok");else if(x===b)x.classList.add("no")});
   ex.querySelector(".gap").textContent=it.ans;
   sayDe(s.t.map(t=>t[0]).join(" "));
   $("#c-res").innerHTML=`<div class="result"><b>${ok?"Doğru":"Yanlış"}</b> · ${esc(LEX[it.key].w)} = ${esc(LEX[it.key].tr)}<div class="sched">${esc(s.tr)}</div><div class="sched">${ok?"Sonraki tekrar: 4 gün":"Sonraki tekrar: 10 dk"}</div><div class="tools"><button class="btn primary" id="c-next">Devam</button></div></div>`;
   $("#c-next").onclick=()=>{i++;step()};
  });
 };step();
}

render();
</script>
</body>
